<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab de Padrões Cartográficos · 3D</title>
<style>
  :root{
    --bg:#0C1114; --panel:#11181D; --panel2:#161F25; --line:#233038;
    --tx:#C7D3D9; --tx-dim:#6E8089; --accent:#45D6C4; --accent-dim:#1E4A45;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:11px;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:16px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:11px;letter-spacing:.18em;font-weight:600}
  header h1 span{color:var(--accent)}
  #readouts{display:flex;gap:16px;margin-left:auto}
  .ro{display:flex;flex-direction:column;align-items:flex-end}
  .ro b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
  .ro i{font-style:normal;color:var(--tx-dim);font-size:9px;letter-spacing:.08em}
  header button{background:var(--panel2);border:1px solid var(--line);color:var(--tx);font:inherit;padding:5px 11px;cursor:pointer}
  header button:hover{border-color:var(--accent);color:var(--accent)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  main{display:flex;flex:1;min-height:0}
  #viewport{position:relative;flex:1;min-width:0;cursor:grab;touch-action:none}
  #viewport.dragging{cursor:grabbing}
  #viewport canvas{display:block}
  #hint{position:absolute;left:12px;top:10px;color:var(--tx-dim);font-size:10px;pointer-events:none;letter-spacing:.05em}
  #toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);color:var(--accent);padding:6px 14px;opacity:0;transition:opacity .2s;pointer-events:none}

  aside{width:336px;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto}
  .s{padding:10px 12px;border-bottom:1px solid var(--line)}
  .s h2, .s summary{font-size:9px;letter-spacing:.2em;color:var(--tx-dim);font-weight:600;margin-bottom:8px}
  details.s summary{cursor:pointer;margin-bottom:0;list-style:none;display:flex;align-items:center;gap:6px}
  details.s summary::before{content:'▸';color:var(--tx-dim);font-size:9px;transition:transform .12s}
  details.s[open] summary::before{transform:rotate(90deg)}
  details.s[open] summary{margin-bottom:8px}

  /* galeria de padrões */
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .pcell{background:var(--panel2);border:1px solid var(--line);padding:4px 2px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  .pcell:hover{border-color:var(--tx-dim)}
  .pcell.on{border-color:var(--accent);background:var(--accent-dim)}
  .pcell canvas{display:block}
  .pcell i{font-style:normal;font-size:9px;color:var(--tx-dim)}
  .pcell.on i{color:var(--accent)}

  /* presets em chips */
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .chip{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:10px;padding:6px 8px;cursor:pointer;text-align:left}
  .chip:hover{border-color:var(--accent)}
  .chip .dot{width:14px;height:14px;border-radius:3px;flex:none}

  /* modos */
  .seg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .seg3 button{background:var(--panel2);border:1px solid var(--line);color:var(--tx-dim);font:inherit;font-size:10px;padding:6px 2px;cursor:pointer}
  .seg3 button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
  .caption{color:var(--tx-dim);font-size:9.5px;margin:7px 1px 9px;line-height:1.45}

  /* linhas de controle */
  .row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .row label{flex:0 0 92px;color:var(--tx-dim)}
  .row output{flex:0 0 52px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{flex:1;accent-color:var(--accent);height:13px}
  input[type=checkbox]{accent-color:var(--accent)}
  .chk{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;color:var(--tx)}
  .num{width:48px;background:var(--panel2);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:10px;padding:4px 5px;text-align:right}
  input[type=file]{width:100%;color:var(--tx-dim);font:inherit;font-size:10px}
  input[type=file]::file-selector-button{background:var(--panel2);border:1px solid var(--line);color:var(--tx);font:inherit;padding:4px 9px;cursor:pointer;margin-right:8px}

  /* linha de cor estilo Figma: swatch + hex + % */
  .crow{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .crow label{flex:0 0 92px;color:var(--tx-dim)}
  .sw{position:relative;width:26px;height:24px;border:1px solid var(--line);flex:none;border-radius:3px}
  .sw input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
  .hex{width:66px;background:var(--panel2);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:10px;padding:4px 6px}
  .pct{width:44px;background:var(--panel2);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:10px;padding:4px 4px;text-align:right}
  .unit{color:var(--tx-dim);font-size:9px}
  #tabbar{display:none}
  @media (max-width:840px){
    main{flex-direction:column}
    header{flex-wrap:wrap;row-gap:6px}
    #readouts .ro:nth-child(2), #readouts .ro:nth-child(4){display:none}
    aside{width:100%;max-height:48%;border-left:none;border-top:1px solid var(--line);display:flex;flex-direction:column}
    #tabbar{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2;flex:none}
    #tabbar button{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--tx-dim);font:inherit;font-size:10px;padding:10px 2px;cursor:pointer}
    #tabbar button.on{color:var(--accent);border-bottom-color:var(--accent)}
    aside .s{display:none}
    aside.tPresets #sPresets, aside.tPattern #sPattern, aside.tScale #sScale, aside.tColors #sColors, aside.t3D #s3D{display:block}
    aside.tMore #dSym, aside.tMore #dVis, aside.tMore #dScene{display:block}
  }
  @media (pointer:coarse){
    body{font-size:12px}
    input[type=range]{height:26px}
    .pcell{padding:7px 2px 6px}
    .chip{padding:10px 8px;font-size:11px}
    .seg3 button{padding:10px 2px;font-size:11px}
    header button{padding:8px 12px}
    .num,.hex,.pct{padding:7px 5px}
    .sw{width:30px;height:28px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>LAB DE PADRÕES <span>CARTOGRÁFICOS · 3D</span></h1>
    <div id="readouts">
      <div class="ro"><b id="roZ">–</b><i>ZOOM Z</i></div>
      <div class="ro"><b id="roPpm">–</b><i>PX / METRO</i></div>
      <div class="ro"><b id="roSpacing">–</b><i>ESPAÇ. EFETIVO</i></div>
      <div class="ro"><b id="roLevel">–</b><i>NÍVEL LOD</i></div>
    </div>
    <button id="btnPng">Exportar PNG</button>
    <button id="btnJson">Copiar JSON</button>
  </header>
  <main>
    <div id="viewport">
      <div id="hint">arrastar = orbitar · shift/botão direito = pan · scroll = zoom</div>
      <div id="toast"></div>
    </div>
    <aside>
      <nav id="tabbar"></nav>
      <section class="s" id="sPresets">
        <h2>PRESETS</h2>
        <div class="chips" id="presets"></div>
      </section>
      <section class="s" id="sPattern">
        <h2>PADRÃO</h2>
        <div class="pgrid" id="patGrid"></div>
        <div class="row" id="rowRot" style="margin-top:8px"><label>rotação</label><input type="range" id="rot" min="0" max="180" step="1"><output id="oRot"></output></div>
      </section>
      <section class="s" id="sScale">
        <h2>ESCALA</h2>
        <div class="seg3" id="modeSeg"></div>
        <div class="caption" id="modeCaption"></div>
        <div class="row"><label id="lblSpacing">espaçamento</label><input type="range" id="spacing" min="2" max="120" step="0.5"><output id="oSpacing"></output></div>
        <div class="row" id="rowLw"><label id="lblLw">espessura</label><input type="range" id="lw" min="0.2" max="30" step="0.1"><output id="oLw"></output></div>
        <div class="row" id="rowSym"><label id="lblSym">tam. símbolo</label><input type="range" id="sym" min="4" max="80" step="1"><output id="oSym"></output></div>
        <div class="row" id="rowPxLim"><label>limites</label><input type="number" class="num" id="minPx" min="2" max="64"><span class="unit">–</span><input type="number" class="num" id="maxPx" min="24" max="400"><span class="unit">px</span></div>
      </section>
      <section class="s" id="sColors">
        <h2>CORES</h2>
        <div class="crow"><label>preenchimento</label><span class="sw" id="swBase"><input type="color" id="baseColor"></span><input type="text" class="hex" id="baseColorHex" maxlength="7" spellcheck="false"><input type="number" class="pct" id="basePct" min="0" max="100"><span class="unit">%</span></div>
        <div class="crow" id="rowPatColor"><label>padrão</label><span class="sw" id="swPat"><input type="color" id="patColor"></span><input type="text" class="hex" id="patColorHex" maxlength="7" spellcheck="false"><input type="number" class="pct" id="patPct" min="0" max="100"><span class="unit">%</span></div>
        <div class="crow"><label>borda</label><span class="sw" id="swOut"><input type="color" id="outColor"></span><input type="text" class="hex" id="outColorHex" maxlength="7" spellcheck="false"><input type="number" class="pct" id="outW" min="0" max="6" step="0.5"><span class="unit">m</span></div>
        <div class="crow"><label>dash da borda</label><input type="number" class="pct" id="dash" min="0" max="24"><span class="unit">m · 0 = sólido</span></div>
      </section>
      <section class="s" id="s3D">
        <h2>DEMARCAÇÃO 3D</h2>
        <label class="chk"><input type="checkbox" id="repPlane"> plano em cota fixa</label>
        <div class="row" id="rowPlaneY"><label>cota do plano</label><input type="range" id="planeY" min="-20" max="60" step="0.5"><output id="oPlaneY"></output></div>
        <label class="chk"><input type="checkbox" id="repDrape"> drapeado no terreno</label>
        <label class="chk"><input type="checkbox" id="repWalls"> paredes no perímetro</label>
        <div class="row" id="rowWallH"><label>topo das paredes</label><input type="range" id="wallH" min="4" max="80" step="1"><output id="oWallH"></output></div>
        <div class="seg3" id="wallStyleSeg" style="grid-template-columns:repeat(4,1fr);margin-bottom:8px"></div>
        <label class="chk"><input type="checkbox" id="repVolume"> volume extrudado</label>
        <div class="row" id="rowVol"><label>base / topo</label><input type="number" class="num" id="volBase" min="-40" max="40"><span class="unit">–</span><input type="number" class="num" id="volTop" min="-40" max="80"><span class="unit">m</span></div>
        <label class="chk"><input type="checkbox" id="volAnim"> pulsar volume</label>
        <label class="chk"><input type="checkbox" id="repScatter"> volumes distribuídos</label>
        <label class="chk" style="margin-top:8px"><input type="checkbox" id="animOn"> animação das paredes</label>
        <div class="row" id="rowSpeed"><label>velocidade</label><input type="range" id="animSpeed" min="0.2" max="3" step="0.1"><output id="oSpeed"></output></div>
        <label class="chk" style="margin-top:8px"><input type="checkbox" id="contours"> curvas de nível (terra + batimetria)</label>
        <label class="chk"><input type="checkbox" id="sea"> mar</label>
      </section>
      <details class="s" id="dSym">
        <summary>SÍMBOLO · SVG / PNG / JPG</summary>
        <input type="file" id="symFile" accept=".svg,image/*">
        <label class="chk" style="margin-top:8px"><input type="checkbox" id="tint" checked> tingir com a cor do padrão</label>
      </details>
      <details class="s" id="dVis">
        <summary>VISIBILIDADE POR ZOOM</summary>
        <label class="chk"><input type="checkbox" id="visOn"> ativar min/max zoom (níveis z)</label>
        <div class="row"><label>zoom mín</label><input type="range" id="minZ" min="0" max="24" step="0.5"><output id="oMinZ"></output></div>
        <div class="row"><label>zoom máx</label><input type="range" id="maxZ" min="0" max="24" step="0.5"><output id="oMaxZ"></output></div>
        <div class="row"><label>fade (níveis)</label><input type="range" id="fadeR" min="0.1" max="3" step="0.1"><output id="oFadeR"></output></div>
      </details>
      <details class="s" id="dScene" open>
        <summary>CENA</summary>
        <div class="seg3" id="themeSeg" style="grid-template-columns:1fr 1fr"></div>
        <label class="chk" style="margin-top:8px"><input type="checkbox" id="bld" checked> edifícios de teste (oclusão)</label>
        <label class="chk"><input type="checkbox" id="post" checked> pós-processamento (bloom seletivo)</label>
        <div class="row" id="rowBloom"><label>intensidade</label><input type="range" id="bloom" min="0" max="2" step="0.05"><output id="oBloom"></output></div>
        <label class="chk"><input type="checkbox" id="shadows" checked> sombras do sol</label>
        <label class="chk"><input type="checkbox" id="ssao" checked> oclusão ambiente (SSAO)</label>
        <div class="row"><label>azimute do sol</label><input type="range" id="sunAz" min="0" max="360" step="1"><output id="oSunAz"></output></div>
        <div class="row"><label>elevação do sol</label><input type="range" id="sunEl" min="12" max="75" step="1"><output id="oSunEl"></output></div>
      </details>
    </aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   Lab de Padrões Cartográficos v3 — 3D.
   Px/metro = pirâmide de níveis (modelo Mapbox): um único nível global
   por frame, ancorado no mundo, escala 100–200% com o zoom, troca de
   nível com histerese e transição TEMPORAL (~0,3s) uniforme — nunca há
   mistura espacial de níveis. GLSL portável 1:1 para o HLSL da spec.
   ===================================================================== */

const PATTERNS = ['Solid','Hatch','CrossHatch','Dots','Plus','Cross','Checker','Bands','Symbol'];
const MODES = [
  {id:'Metros',    btn:'Metros',   unit:'m',  cap:'Tamanho físico real no terreno. Some em zoom distante — combine com visibilidade por zoom.'},
  {id:'Pixels',    btn:'Px tela',  unit:'px', cap:'Fixo na tela (2D/HUD). Ignora a perspectiva por definição — só como referência do paradigma Mapbox 2D.'},
  {id:'PxPorMetro',btn:'Px/metro', unit:'px', cap:'Ancorado no mundo. Escala 100–200% com o zoom e troca de nível em transição temporal (modelo pirâmide, como Mapbox).'},
];
const MODE_ORDER = [0, 2, 1];

const state = {
  pattern:2, mode:2,
  spacing:24, lw:1.6, sym:16, rot:45,
  baseColor:'#D64545', baseA:0.25,
  patColor:'#7A1010',  patA:0.9,
  outColor:'#FF5050',  outW:1.5, dash:6,
  minPx:8, maxPx:120, tint:true,
  visOn:false, minZ:12, maxZ:22, fadeR:1, theme:'dark', bld:true, post:true, bloom:0.8,
  shadows:true, ssao:true, sunAz:130, sunEl:34,
  repPlane:false, repDrape:true, repWalls:true, repVolume:false, repScatter:false,
  planeY:0.5, wallH:26, volBase:-16, volTop:2, animOn:true, animSpeed:1, wallStyle:0, volAnim:false,
  contours:true, sea:true,
};

const PRESETS = [
  {n:'Zona restrita', p:{pattern:2,mode:2,spacing:24,lw:1.6,rot:45,baseColor:'#D64545',baseA:.25,patColor:'#FF5050',patA:.55,outColor:'#FF5050',outW:1.5,dash:6,
    repPlane:false,repDrape:true,repWalls:true,repVolume:false,repScatter:false,wallH:30,animOn:true,wallStyle:0}},
  {n:'Fundeio',       p:{pattern:4,mode:2,spacing:46,lw:2.4,rot:0,baseColor:'#2A6FB0',baseA:.14,patColor:'#7FB8E8',patA:.95,outColor:'#7FB8E8',outW:1,dash:0,
    repPlane:false,repDrape:true,repWalls:false,repVolume:true,repScatter:true,volBase:-18,volTop:0,volAnim:true}},
  {n:'Área dragada',  p:{pattern:3,mode:2,spacing:22,lw:5,rot:0,baseColor:'#3E7CB8',baseA:.10,patColor:'#9DC7EA',patA:.9,outColor:'#9DC7EA',outW:1,dash:5,
    repPlane:false,repDrape:true,repWalls:false,repVolume:false,repScatter:false}},
  {n:'Canal de naveg.',p:{pattern:7,mode:2,spacing:52,lw:21,rot:60,baseColor:'#45D6C4',baseA:.10,patColor:'#45D6C4',patA:.45,outColor:'#45D6C4',outW:0,dash:0,
    repPlane:false,repDrape:true,repWalls:true,repVolume:true,repScatter:false,volBase:-16,volTop:1,wallH:1,animOn:true,wallStyle:1,volAnim:false}},
  {n:'Berço',         p:{pattern:0,mode:0,baseColor:'#E4C75B',baseA:.30,patA:0,outColor:'#E4C75B',outW:1.5,dash:0,
    repPlane:true,repDrape:false,repWalls:true,repVolume:false,repScatter:false,planeY:2,wallH:10,animOn:false,wallStyle:2}},
  {n:'Limite adm.',   p:{pattern:0,mode:0,baseA:0,patA:0,outColor:'#C7D3D9',outW:2,dash:12,
    repPlane:true,repDrape:false,repWalls:false,repVolume:false,repScatter:false,planeY:28}},
  {n:'Sobreposição',  p:{pattern:1,mode:2,spacing:18,lw:1.3,rot:45,baseColor:'#C9A227',baseA:.15,patColor:'#E4C75B',patA:.85,outColor:'#E4C75B',outW:.8,dash:0,
    repPlane:false,repDrape:true,repWalls:false,repVolume:false,repScatter:false}},
  {n:'Símbolo',       p:{pattern:8,mode:2,spacing:56,sym:26,rot:0,baseColor:'#2F8F6E',baseA:.12,patColor:'#8FE0BF',patA:.95,outColor:'#8FE0BF',outW:1,dash:0,
    repPlane:false,repDrape:true,repWalls:false,repVolume:false,repScatter:false}},
];

const POLY_A_OUTER=[[-180,-120],[120,-160],[200,-20],[90,40],[150,160],[-40,120],[-120,170],[-200,30]];
const POLY_A_HOLE =[[-60,-40],[30,-60],[50,10],[-30,30]];
const POLY_B      =[[240,-120],[320,-140],[340,-70],[260,-50]];

/* ---------------- Shaders ---------------- */
const FILL_VS = `
varying vec3 vW;
void main(){
  vec4 w = modelMatrix * vec4(position,1.0);
  vW = w.xyz;
  gl_Position = projectionMatrix * viewMatrix * w;
}`;

/* Sol, sombra e fog compartilhados entre os shaders de superfície */
const sunDirV = new THREE.Vector3(0.42, 0.62, 0.55).normalize();
const gSun = {value:sunDirV}, gShadowTex = {value:null},
      gShadowMat = {value:new THREE.Matrix4()}, gShadowOn = {value:1},
      gFogCol = {value:new THREE.Color(0x141F26)};
function sunShadowUniforms(){ return {uSunDir:gSun, uShadow:gShadowTex, uShadowMat:gShadowMat, uShadowOn:gShadowOn, uFogCol:gFogCol}; }
const SHADOW_GLSL = `
uniform vec3 uSunDir; uniform vec3 uFogCol;
uniform sampler2D uShadow; uniform mat4 uShadowMat; uniform int uShadowOn;
float shadowAt(vec3 w){
  if(uShadowOn == 0) return 1.0;
  vec4 sp = uShadowMat * vec4(w, 1.0);
  vec3 s = sp.xyz / sp.w * 0.5 + 0.5;
  if(s.x < 0.0 || s.x > 1.0 || s.y < 0.0 || s.y > 1.0 || s.z > 1.0) return 1.0;
  float sh = 0.0;
  for(int i = -1; i <= 1; i++) for(int j = -1; j <= 1; j++){
    float d = texture2D(uShadow, s.xy + vec2(float(i), float(j)) / 2048.0).r;
    sh += step(s.z - 0.0025, d);
  }
  return (sh / 9.0) * 0.72 + 0.28;   /* sombra nunca 100% preta (luz de céu) */
}
float fogAt(vec3 w){ return smoothstep(2200.0, 11000.0, length(w - cameraPosition)); }`;

/* Biblioteca de padrões compartilhada entre o shader do plano e o do terreno (drape) */
const PAT_LIB = `
uniform int   uPattern;
uniform int   uMode;         /* 0 metros | 1 px tela | 2 px/metro */
uniform float uSpacing, uLw, uSym, uRot;
uniform vec4  uBase, uPat;
uniform sampler2D uTex;
uniform int   uTint;
uniform float uFade;
/* px/metro — pirâmide (valores calculados por frame na CPU): */
uniform float uSw;    /* espaçamento do nível ativo (m) */
uniform float uF;     /* transição temporal 0..1 (uniforme na superfície) */
uniform float uHwW, uArmW, uSymW;  /* meia-espessura / braço / símbolo (m, já com crescimento 2^f) */

mat2 rot2(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }

float lineCov(float x, float s, float hw, float f){
  float n  = floor(x/s + 0.5);
  float d  = abs(x - n*s);
  float aa = max(fwidth(x), 1e-6);
  float c  = 1.0 - smoothstep(hw-aa, hw+aa, d);
  float odd = step(0.5, abs(mod(n, 2.0)));
  return c * mix(1.0, 1.0-f, odd);
}
vec2 cellOf(vec2 p, float s, out vec2 id){
  vec2 q = p/s + 0.5; id = floor(q);
  return (fract(q) - 0.5) * s;
}
float cellFade(vec2 id, float f){
  float odd = max(step(0.5, abs(mod(id.x,2.0))), step(0.5, abs(mod(id.y,2.0))));
  return mix(1.0, 1.0-f, odd);
}
float discCov(float sd, float aa){ return 1.0 - smoothstep(-aa, aa, sd); }
float sdPlus(vec2 c, float arm, float t){
  vec2 a = abs(c);
  return min(max(a.x-arm, a.y-t), max(a.y-arm, a.x-t));
}
float checkerCov(vec2 p, float s){
  vec2 q = p/s; vec2 w = max(fwidth(q), vec2(1e-6));
  vec2 i = 2.0*(abs(fract((q-0.5*w)*0.5)-0.5) - abs(fract((q+0.5*w)*0.5)-0.5))/w;
  return 0.5 - 0.5*i.x*i.y;
}
float meanCov(float s, float hw){
  if(uPattern==1 || uPattern==7) return clamp(2.0*hw/s, 0.0, 1.0);
  if(uPattern==2) return clamp(4.0*hw/s, 0.0, 1.0);
  if(uPattern==3) return clamp(3.14159*hw*hw/(s*s), 0.0, 1.0);
  if(uPattern==4 || uPattern==5) return clamp(2.4*hw/s, 0.0, 1.0);
  if(uPattern==6) return 0.5;
  return 0.3;
}

vec4 evalPattern(vec2 world, vec2 fragPx){
  float ppm = 1.0 / max(length(fwidth(world)), 1e-8);

  vec2 p; float s, hw, symSz, armLen; float f = 0.0;
  if(uMode == 1){
    p = fragPx; s = uSpacing; hw = uLw*0.5; symSz = uSym; armLen = 0.30*uSpacing;
  } else if(uMode == 0){
    p = world; s = uSpacing; hw = uLw*0.5; symSz = uSym; armLen = 0.30*uSpacing;
  } else {
    p = world; s = uSw; f = uF; hw = uHwW; symSz = uSymW; armLen = uArmW;
  }
  p = rot2(-uRot) * p;

  float cov = 0.0; vec3 patRGB = uPat.rgb;
  float aa = max(length(fwidth(p)), 1e-6);

  if(uPattern == 1 || uPattern == 7){ cov = lineCov(p.y, s, hw, f); }
  else if(uPattern == 2){ cov = max(lineCov(p.y, s, hw, f), lineCov(p.x, s, hw, f)); }
  else if(uPattern == 3){ vec2 id; vec2 c = cellOf(p, s, id); cov = discCov(length(c)-hw, aa) * cellFade(id, f); }
  else if(uPattern == 4){ vec2 id; vec2 c = cellOf(p, s, id); cov = discCov(sdPlus(c, armLen, hw), aa) * cellFade(id, f); }
  else if(uPattern == 5){ vec2 id; vec2 c = rot2(0.7853982)*cellOf(p, s, id); cov = discCov(sdPlus(c, armLen, hw), aa) * cellFade(id, f); }
  else if(uPattern == 6){ cov = checkerCov(p, s); }
  else if(uPattern == 8){
    vec2 id; vec2 c = cellOf(p, s, id);
    vec2 uv = c/symSz + 0.5;
    float inside = step(0.0, uv.x)*step(uv.x, 1.0)*step(0.0, uv.y)*step(uv.y, 1.0);
    vec4 t = texture2D(uTex, clamp(uv, 0.0, 1.0)) * inside;
    cov = t.a * cellFade(id, f);
    if(uTint == 0) patRGB = t.a > 0.001 ? t.rgb / max(t.a, 0.001) : patRGB;
  }

  if(uMode == 0 && uPattern != 0){
    float spx = s * ppm;
    cov = mix(cov, meanCov(s, hw), 1.0 - smoothstep(1.5, 3.5, spx));
  }

  vec4 patC = vec4(patRGB, uPat.a * cov);
  float a0  = patC.a + uBase.a * (1.0 - patC.a);
  vec3 rgb  = (patC.rgb*patC.a + uBase.rgb*uBase.a*(1.0-patC.a)) / max(a0, 1e-4);
  return vec4(rgb, a0 * uFade);
}`;

const FILL_FS = `
precision highp float;
varying vec3 vW;
` + PAT_LIB + `
void main(){

const TERRAIN_FS = `
precision highp float;
varying vec3 vW;
varying vec3 vN;
` + PAT_LIB + SHADOW_GLSL + `
uniform sampler2D uMaskT;
uniform int   uDrape, uContours;
uniform vec2  uMaskMin, uMaskSize;
float contourLine(float h, float itv, float w){
  float d  = abs(fract(h/itv + 0.5) - 0.5) * itv;
  float aa = max(fwidth(h), 1e-5);
  return 1.0 - smoothstep(w*aa, (w+1.2)*aa, d);
}
void main(){
  float h = vW.y;
  vec3 col = h < 0.0
    ? mix(vec3(0.088,0.148,0.185), vec3(0.045,0.078,0.105), clamp(-h/25.0, 0.0, 1.0))
    : mix(vec3(0.155,0.205,0.183), vec3(0.278,0.302,0.252), clamp(h/32.0, 0.0, 1.0));
  vec3 nrm = normalize(vN);
  float l = clamp(dot(nrm, normalize(uSunDir)), 0.0, 1.0);
  col *= 0.42 + 0.58 * l * shadowAt(vW);
  float slope = 1.0 - clamp(nrm.y, 0.0, 1.0);
  col = mix(col, vec3(0.235,0.255,0.262), smoothstep(0.25, 0.55, slope) * step(0.0, h));   /* rocha em encosta */
  col *= 1.0 + (sin(vW.x*0.31)*sin(vW.z*0.29) + 0.5*sin(vW.x*1.13 + vW.z*0.77)) * 0.025;  /* micro-variação */
  if(uContours == 1){
    float minor = contourLine(h, 2.0, 1.0);
    float major = contourLine(h, 10.0, 1.5);
    vec3 cc = h < 0.0 ? vec3(0.36,0.56,0.72) : vec3(0.50,0.69,0.64);
    col = mix(col, cc, minor*0.16 + major*0.34);
  }
  if(uDrape == 1){
    vec2 mu = (vW.xz - uMaskMin) / uMaskSize;
    if(mu.x > 0.0 && mu.x < 1.0 && mu.y > 0.0 && mu.y < 1.0){
      float m = texture2D(uMaskT, mu).r;
      if(m > 0.003){
        vec4 pc = evalPattern(vW.xz, gl_FragCoord.xy);
        col = mix(col, pc.rgb, pc.a * m);
      }
    }
  }
  col = mix(col, uFogCol, fogAt(vW));
  gl_FragColor = vec4(col, 1.0);
}`;

const WALL_FS = `
precision highp float;
varying float vT; varying float vD; varying float vY;
uniform vec3 uCol; uniform float uTime, uSpeed, uGFade; uniform int uAnim, uWStyle;
float hexDist(vec2 p){ p = abs(p); return max(dot(p, vec2(0.5, 0.8660254)), p.x); }
float hexGrid(vec2 p, float s){
  vec2 q = p / s;
  vec2 r = vec2(1.0, 1.7320508);
  vec2 a2 = mod(q, r) - r*0.5;
  vec2 b2 = mod(q - r*0.5, r) - r*0.5;
  vec2 g = dot(a2,a2) < dot(b2,b2) ? a2 : b2;
  return smoothstep(0.40, 0.5, hexDist(g));
}
void main(){
  float a = mix(0.34, 0.05, vT);
  float t = (uAnim == 1) ? uTime * uSpeed : 0.0;
  float glow = 0.0;
  if(uWStyle == 0){                        /* PULSO: varreduras subindo */
    float p = fract(vY/9.0 - t*0.25);
    glow = (smoothstep(0.0,0.05,p) - smoothstep(0.05,0.16,p)) * 0.32;
  } else if(uWStyle == 1){                 /* FLUXO: tracos correndo no perimetro (direcao) */
    float m = fract(vD/22.0 - t*0.5);
    glow = (smoothstep(0.0,0.08,m) - smoothstep(0.42,0.55,m)) * 0.22;
  } else if(uWStyle == 2){                 /* HEX: malha de escudo + varredura grande */
    glow = hexGrid(vec2(vD, vY), 7.0) * 0.26;
    float p = fract(vY/26.0 - t*0.12);
    glow += (smoothstep(0.0,0.10,p) - smoothstep(0.10,0.30,p)) * 0.18;
  } else {                                 /* ENERGIA: interferencia senoidal */
    float n = sin(vD*0.32 + t*2.1) * sin(vY*0.85 - t*1.4)
            + 0.5*sin(vD*0.11 - t*1.3) * sin(vY*0.37 + t*0.8);
    glow = max(n, 0.0) * 0.20;
  }
  a += glow;
  a += smoothstep(0.965, 1.0, vT) * 0.45;  /* fio de luz no topo */
  gl_FragColor = vec4(uCol + glow*0.6, a * uGFade);
}`;

const VOL_FS = `
precision highp float;
varying float vT; varying float vD; varying float vY;
uniform vec3 uCol; uniform float uGFade, uTime; uniform int uVolAnim;
void main(){

const SEA_FS = `
precision highp float;

uniform float uTime;
` + SHADOW_GLSL + `
void main(){
  vec3 V = normalize(cameraPosition - vW);
  float t = uTime;
  /* normal perturbada por dois campos de onda direcionais */
  float dx = 0.05*cos(vW.x*0.062 + t*0.9) + 0.03*cos((vW.x*0.5 - vW.z)*0.041 - t*0.6);
  float dz = 0.05*cos(vW.z*0.054 - t*0.7) + 0.03*cos((vW.z*0.5 + vW.x)*0.037 + t*0.5);

  float fres = pow(1.0 - max(dot(V, n), 0.0), 3.0);
  vec3 col = mix(vec3(0.055,0.145,0.195), vec3(0.10,0.235,0.30), fres) * (0.78 + 0.22*sh) + spec;
  col = mix(col, uFogCol, fogAt(vW));
  gl_FragColor = vec4(col, 0.42 + 0.38*fres);
}`;

const BLUR_FS = `
precision highp float; varying vec2 vUv; uniform sampler2D tSrc; uniform vec2 uDir;
void main(){

  a += (texture2D(tSrc, vUv + uDir*1.3846).rgb + texture2D(tSrc, vUv - uDir*1.3846).rgb) * 0.3162162;
  a += (texture2D(tSrc, vUv + uDir*3.2308).rgb + texture2D(tSrc, vUv - uDir*3.2308).rgb) * 0.0702703;

const COMP_FS = `
precision highp float; varying vec2 vUv;
uniform sampler2D tScene, tBloom, tAO; uniform float uBloom, uTime; uniform int uAoOn;
float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
void main(){
  float ao = (uAoOn == 1) ? texture2D(tAO, vUv).r : 1.0;
  vec3 c = texture2D(tScene, vUv).rgb * mix(0.55, 1.0, ao) + texture2D(tBloom, vUv).rgb * uBloom;

/* ---- SSAO (posição+normal reconstruídas do depth) e FXAA final ---- */
const AO_FS = `
precision highp float; varying vec2 vUv;
uniform sampler2D tDepth; uniform mat4 uProjInv;
float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
vec3 vpos(vec2 uv){
  float d = texture2D(tDepth, uv).r;
  vec4 n = vec4(uv*2.0-1.0, d*2.0-1.0, 1.0);
  vec4 v = uProjInv * n;
  return v.xyz / v.w;
}
void main(){
  vec3 P = vpos(vUv);
  if(-P.z > 16000.0){ gl_FragColor = vec4(1.0); return; }
  vec3 N = normalize(cross(dFdx(P), dFdy(P)));
  float ang = hash21(vUv*vec2(1477.0,911.0)) * 6.2831;
  float ca = cos(ang), sa = sin(ang);
  float occ = 0.0;
  for(int i = 0; i < 8; i++){
    float fi = float(i);
    vec2 d = vec2(cos(fi*2.4), sin(fi*2.4)) * ((fi+1.0)/8.0);
    d = vec2(d.x*ca - d.y*sa, d.x*sa + d.y*ca);
    vec3 S = vpos(vUv + d * clamp(9.0 / -P.z, 0.002, 0.05));
    vec3 dv = S - P; float dist = length(dv);
    occ += max(0.0, dot(N, dv) / max(dist, 0.001) - 0.05) * (1.0 / (1.0 + dist*0.18));
  }
  gl_FragColor = vec4(vec3(pow(clamp(1.0 - occ/8.0*1.9, 0.0, 1.0), 1.5)), 1.0);
}`;
const FXAA_FS = `
precision highp float; varying vec2 vUv; uniform sampler2D tSrc; uniform vec2 uTexel;
void main(){
  vec3 luma = vec3(0.299, 0.587, 0.114);
  float lNW = dot(texture2D(tSrc, vUv + vec2(-1.,-1.)*uTexel).rgb, luma);
  float lNE = dot(texture2D(tSrc, vUv + vec2( 1.,-1.)*uTexel).rgb, luma);
  float lSW = dot(texture2D(tSrc, vUv + vec2(-1., 1.)*uTexel).rgb, luma);
  float lSE = dot(texture2D(tSrc, vUv + vec2( 1., 1.)*uTexel).rgb, luma);
  vec3 rgbM = texture2D(tSrc, vUv).rgb;
  float lM = dot(rgbM, luma);
  float lMin = min(lM, min(min(lNW,lNE), min(lSW,lSE)));
  float lMax = max(lM, max(max(lNW,lNE), max(lSW,lSE)));
  vec2 dir = vec2(-((lNW+lNE)-(lSW+lSE)), ((lNW+lSW)-(lNE+lSE)));
  float dirReduce = max((lNW+lNE+lSW+lSE)*0.03125, 0.0078125);
  float rcp = 1.0/(min(abs(dir.x), abs(dir.y)) + dirReduce);
  dir = clamp(dir*rcp, -8.0, 8.0) * uTexel;
  vec3 a = 0.5*(texture2D(tSrc, vUv + dir*(1.0/3.0-0.5)).rgb + texture2D(tSrc, vUv + dir*(2.0/3.0-0.5)).rgb);
  vec3 b = a*0.5 + 0.25*(texture2D(tSrc, vUv + dir*-0.5).rgb + texture2D(tSrc, vUv + dir*0.5).rgb);
  float lB = dot(b, luma);
  gl_FragColor = vec4((lB < lMin || lB > lMax) ? a : b, 1.0);
}`;

const BLD_FS = `
precision highp float;
varying vec3 vW; varying vec3 vN;
` + SHADOW_GLSL + `
float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
void main(){
  vec3 col = vec3(0.263,0.310,0.345);
  float l = clamp(dot(normalize(vN), normalize(uSunDir)), 0.0, 1.0);
  col *= 0.40 + 0.60 * l * shadowAt(vW + vN * 0.5);
  if(abs(vN.y) < 0.5){                             /* fachadas: janelas procedurais */
    vec2 fuv = (abs(vN.x) > 0.5) ? vec2(vW.z, vW.y) : vec2(vW.x, vW.y);
    vec2 cs = vec2(3.4, 2.8);
    vec2 cell = floor(fuv / cs);
    vec2 fr = fract(fuv / cs);
    float win = step(0.22, fr.x)*step(fr.x, 0.82)*step(0.25, fr.y)*step(fr.y, 0.78);
    float lit = step(0.62, hash21(cell));          /* ~38% acesas, estático — sem flicker */
    col = mix(col, vec3(0.55,0.71,0.78), win*lit*0.40);
    col = mix(col, col*0.82, win*(1.0-lit)*0.5);
  } else if(vN.y > 0.5){ col *= 1.10; }
  col = mix(col, uFogCol, fogAt(vW));
  gl_FragColor = vec4(col, 1.0);
}`;

function subdivRing(ring, step){
  const out = [];
  for(let i=0;i<ring.length;i++){
    const a = ring[i], b = ring[(i+1)%ring.length];
    const L = len2(sub2(b,a)), n = Math.max(1, Math.ceil(L/step));
    for(let k=0;k<n;k++) out.push([a[0]+(b[0]-a[0])*k/n, a[1]+(b[1]-a[1])*k/n]);
  }
  return out;
}
function buildCurtain(ring, topFn, baseFn){
  const pts = subdivRing(ring, 8);
  const n = pts.length, pos=[], aT=[], dist=[], idx=[];
  let acc = 0;
  for(let i=0;i<=n;i++){
    const p = pts[i%n];
    if(i>0) acc += len2(sub2(p, pts[(i-1)%n]));
    const b = baseFn(p[0],p[1]), t = topFn(p[0],p[1]);
    pos.push(p[0],b,p[1], p[0],t,p[1]);
    aT.push(0,1); dist.push(acc,acc);
    if(i<n){ const k=i*2; idx.push(k,k+1,k+2, k+1,k+3,k+2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('aT', new THREE.Float32BufferAttribute(aT,1));
  g.setAttribute('dist', new THREE.Float32BufferAttribute(dist,1));
  g.setIndex(idx);
  return g;
}

function pip(x, z, ring){
  let c = false;
  for(let i=0, j=ring.length-1; i<ring.length; j=i++){
    const xi=ring[i][0], zi=ring[i][1], xj=ring[j][0], zj=ring[j][1];
    if(((zi>z)!==(zj>z)) && (x < (xj-xi)*(z-zi)/(zj-zi)+xi)) c = !c;
  }
  return c;
}
function rebuildScatter(){
  if(scatterMesh){ scene.remove(scatterMesh); scatterMesh.geometry.dispose(); scatterMesh = null; }
  const b = Math.min(state.volBase, state.volTop)+3, t = Math.max(state.volBase, state.volTop)-2;
  const spots = [];
  for(let x=-330; x<=420; x+=26) for(let z=-290; z<=290; z+=26){
    const inA = pip(x,z,POLY_A_OUTER) && !pip(x,z,POLY_A_HOLE);
    if(inA || pip(x,z,POLY_B)){
      for(let y=b; y<=Math.max(b,t); y+=12) spots.push([x,y,z]);
    }
  }
  const n = Math.min(spots.length, 2400);
  scatterMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(3.5,3.5,3.5),
    new THREE.MeshBasicMaterial({color:state.patColor, transparent:true, opacity:0.32, depthWrite:false}), n);
  const M = new THREE.Matrix4();
  for(let i=0;i<n;i++){ M.setPosition(spots[i][0], spots[i][1], spots[i][2]); scatterMesh.setMatrixAt(i, M); }
  scatterMesh.renderOrder = 3;
  scene.add(scatterMesh);
}

function sub2(a,b){return [a[0]-b[0], a[1]-b[1]];}
function len2(a){return Math.hypot(a[0],a[1]);}
function norm2(a){const l=len2(a)||1; return [a[0]/l, a[1]/l];}
function buildRibbon(ring, widthM){
  const n = ring.length, pos = [], distA = [], idx = [];
  let acc = 0;
  for(let i=0;i<=n;i++){
    const p  = ring[i % n], pPrev = ring[(i-1+n) % n], pNext = ring[(i+1) % n];
    const d0 = norm2(sub2(p, pPrev)), d1 = norm2(sub2(pNext, p));
    const n0 = [-d0[1], d0[0]], n1 = [-d1[1], d1[0]];
    let m = norm2([n0[0]+n1[0], n0[1]+n1[1]]);
    let scale = 1 / Math.max(0.34, m[0]*n1[0] + m[1]*n1[1]);
    if(i>0) acc += len2(sub2(p, pPrev));
    const hw = widthM*0.5*scale;
    const yv = state.planeY + 0.12;
    pos.push(p[0]+m[0]*hw, yv, p[1]+m[1]*hw,  p[0]-m[0]*hw, yv, p[1]-m[1]*hw);
    distA.push(acc, acc);
    if(i<n){ const b=i*2; idx.push(b,b+1,b+2, b+1,b+3,b+2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('dist', new THREE.Float32BufferAttribute(distA,1));
  g.setIndex(idx);
  return g;
}
function rebuildOutlines(){

/* ---------------- Câmera orbital (pan por vetores da câmera) ---------------- */
const cam = {theta:-0.55, phi:0.95, dist:760, target:new THREE.Vector3(60,0,0)};
function applyCam(){
  cam.phi = Math.min(Math.max(cam.phi, 0.06), 1.52);
  cam.dist = Math.min(Math.max(cam.dist, 25), 18000);
  const sp = Math.sin(cam.phi), x = cam.dist*sp*Math.sin(cam.theta), z = cam.dist*sp*Math.cos(cam.theta);
  camera.position.set(cam.target.x + x, cam.dist*Math.cos(cam.phi), cam.target.z + z);
  camera.lookAt(cam.target);
  camera.updateMatrixWorld();
}
const pts = new Map();
let gesture = null;
function panBy(dx, dy){
  const k = cam.dist * 0.0013;
  const fx = -Math.sin(cam.theta), fz = -Math.cos(cam.theta);
  const rx =  Math.cos(cam.theta), rz = -Math.sin(cam.theta);
  cam.target.x += (-rx*dx + fx*dy) * k;
  cam.target.z += (-rz*dx + fz*dy) * k;
}
function pinchState(){
  const [a,b] = [...pts.values()];
  return { d: Math.max(Math.hypot(a.x-b.x, a.y-b.y), 1), mx:(a.x+b.x)/2, my:(a.y+b.y)/2 };
}
viewport.addEventListener('contextmenu', e => e.preventDefault());
viewport.addEventListener('pointerdown', e => {
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  viewport.setPointerCapture(e.pointerId);
  viewport.classList.add('dragging');
  if(pts.size === 2) gesture = {type:'pinch', ...pinchState()};
  else gesture = {type:(e.button===2 || e.shiftKey) ? 'pan' : 'orbit', x:e.clientX, y:e.clientY};
});
viewport.addEventListener('pointermove', e => {
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(gesture && gesture.type === 'pinch' && pts.size === 2){
    const s = pinchState();
    cam.dist *= gesture.d / s.d;                    /* pinça = zoom */
    panBy(s.mx - gesture.mx, s.my - gesture.my);    /* arrastar os 2 dedos = pan */
    gesture = {type:'pinch', ...s};
  } else if(gesture && pts.size === 1){
    const dx = e.clientX - gesture.x, dy = e.clientY - gesture.y;
    if(gesture.type === 'pan') panBy(dx, dy);
    else { cam.theta -= dx * 0.0055; cam.phi -= dy * 0.0045; }
    gesture.x = e.clientX; gesture.y = e.clientY;
  }
});
function endPointer(e){
  pts.delete(e.pointerId);
  if(pts.size === 1){ const p = [...pts.values()][0]; gesture = {type:'orbit', x:p.x, y:p.y}; }
  else if(pts.size === 0){ gesture = null; viewport.classList.remove('dragging'); }
}
viewport.addEventListener('pointerup', endPointer);
viewport.addEventListener('pointercancel', endPointer);
viewport.addEventListener('wheel', e => { e.preventDefault(); cam.dist *= Math.exp(e.deltaY*0.0011); }, {passive:false});

/* ---------------- LOD global do modo px/metro (pirâmide + histerese) ---------------- */
const lod = {s:1, f:0, dir:0, init:false};
function updateLOD(ppmC, dt){
  const tPx = state.spacing * DPR;
  let Lstar = Math.log2(tPx / ppmC);
  const Lmin = Math.log2(state.minPx*DPR / ppmC), Lmax = Math.log2(state.maxPx*DPR / ppmC);
  Lstar = Math.min(Math.max(Lstar, Lmin), Lmax);
  if(!lod.init){ lod.s = Math.pow(2, Math.round(Lstar)); lod.f = 0; lod.dir = 0; lod.init = true; }
  const Ldisp = Math.log2(lod.s) + lod.f;
  if(lod.dir === 0){
    if(Lstar > Ldisp + 0.75) lod.dir = 1;                       /* engrossar: ímpares saem */
    else if(Lstar < Ldisp - 0.75){ lod.s /= 2; lod.f = 1; lod.dir = -1; } /* refinar: ímpares entram */
  }
  if(lod.dir !== 0){
    lod.f += lod.dir * dt / 0.28;
    if(lod.f >= 1){ lod.s *= 2; lod.f = 0; lod.dir = 0; }
    else if(lod.f <= 0){ lod.f = 0; lod.dir = 0; }
  }
}

function drawThumb(cv, i){
  const g = cv.getContext('2d'), w = cv.width, h = cv.height;
  g.clearRect(0,0,w,h);
  g.strokeStyle = g.fillStyle = '#9FB3BB'; g.lineWidth = 1.4; g.lineCap='round';
  const line = (x1,y1,x2,y2)=>{ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); };
  if(i===0){ g.globalAlpha=.3; g.fillRect(4,4,w-8,h-8); g.globalAlpha=1; }
  if(i===1||i===7){ g.lineWidth = i===7?5:1.4; for(let x=-h;x<w+h;x+=i===7?14:8) line(x,h,x+h,0); }
  if(i===2){ for(let x=-h;x<w+h;x+=9){ line(x,h,x+h,0); line(x,0,x+h,h); } }
  if(i===3){ for(let y=6;y<h;y+=9) for(let x=6;x<w;x+=9){ g.beginPath(); g.arc(x,y,1.8,0,7); g.fill(); } }
  if(i===4){ for(let y=8;y<h;y+=13) for(let x=8;x<w;x+=13){ line(x-4,y,x+4,y); line(x,y-4,x,y+4); } }
  if(i===5){ for(let y=8;y<h;y+=13) for(let x=8;x<w;x+=13){ line(x-3,y-3,x+3,y+3); line(x-3,y+3,x+3,y-3); } }
  if(i===6){ g.globalAlpha=.55; for(let y=0;y<4;y++) for(let x=0;x<6;x++){ if((x+y)%2===0) g.fillRect(2+x*9, 2+y*8, 9, 8); } g.globalAlpha=1; }
  if(i===8){ for(let y=10;y<h;y+=16) for(let x=10;x<w;x+=18){ for(let k=0;k<3;k++){ const a=k*Math.PI/3+.5; line(x-Math.cos(a)*5, y-Math.sin(a)*5, x+Math.cos(a)*5, y+Math.sin(a)*5); } } }
}

  ['rot','oRot', v=>v+'°'],
  ['minZ','oMinZ', v=>'z '+v.toFixed(1)], ['maxZ','oMaxZ', v=>'z '+v.toFixed(1)], ['fadeR','oFadeR', v=>v.toFixed(1)],
  ['planeY','oPlaneY', v=>v.toFixed(1)+' m'], ['wallH','oWallH', v=>v.toFixed(0)+' m'], ['animSpeed','oSpeed', v=>v.toFixed(1)+'×'], ['bloom','oBloom', v=>v.toFixed(2)+'×'], ['sunAz','oSunAz', v=>v+'°'], ['sunEl','oSunEl', v=>v+'°'],
];
function bindUI(){
  sliders.forEach(([id,out,fmt])=>{
    $(id).addEventListener('input', e=>{ state[id]=parseFloat(e.target.value); $(out).textContent=fmt(state[id]); });
  });
  /* cores estilo Figma: swatch (color input invisível por cima) + hex + % */
  [['baseColor','swBase'],['patColor','swPat'],['outColor','swOut']].forEach(([id,sw])=>{
    $(id).addEventListener('input', e=>{ state[id]=e.target.value; $(sw).style.background=state[id]; $(id+'Hex').value=state[id]; });
    $(id+'Hex').addEventListener('change', e=>{
      let v = e.target.value.trim(); if(v[0] !== '#') v = '#'+v;
      if(/^#[0-9a-fA-F]{6}$/.test(v)){ state[id]=v; $(id).value=v; $(sw).style.background=v; }
      else { e.target.value = state[id]; }
    });
  });
  $('basePct').addEventListener('input', e=> state.baseA = Math.min(Math.max(e.target.value/100,0),1));
  $('patPct').addEventListener('input', e=> state.patA = Math.min(Math.max(e.target.value/100,0),1));
  $('outW').addEventListener('input', e=>{ state.outW=parseFloat(e.target.value)||0; rebuildOutlines(); });
  $('dash').addEventListener('input', e=> state.dash=parseFloat(e.target.value)||0);
  $('minPx').addEventListener('input', e=> state.minPx=Math.max(2, parseFloat(e.target.value)||8));
  $('maxPx').addEventListener('input', e=> state.maxPx=Math.max(24, parseFloat(e.target.value)||120));
  $('tint').addEventListener('change', e=> state.tint=e.target.checked);
  $('visOn').addEventListener('change', e=> state.visOn=e.target.checked);
  $('bld').addEventListener('change', e=>{ state.bld=e.target.checked; bldGroup.visible=state.bld; shadowDirty = true; });
  $('post').addEventListener('change', e=>{ state.post=e.target.checked; refreshUI(); });
  ['shadows','ssao'].forEach(id=> $(id).addEventListener('change', e=>{ state[id]=e.target.checked; if(id==='shadows') shadowDirty = true; }));
  $('sunAz').addEventListener('input', updateSun);
  $('sunEl').addEventListener('input', updateSun);
  ['repPlane','repDrape','repWalls','repVolume','repScatter','volAnim','animOn','contours','sea'].forEach(id=>
    $(id).addEventListener('change', e=>{ state[id]=e.target.checked; applyReps(); }));
  $('planeY').addEventListener('input', e=>{ applyPlaneY(); rebuildOutlines(); });
  $('wallH').addEventListener('input', ()=> rebuildWalls());
  $('volBase').addEventListener('change', e=>{ state.volBase=parseFloat(e.target.value)||0; rebuildVolume(); rebuildScatter(); applyReps(); });
  $('volTop').addEventListener('change', e=>{ state.volTop=parseFloat(e.target.value)||0; rebuildVolume(); rebuildScatter(); applyReps(); });
  $('symFile').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const c=document.createElement('canvas'); c.width=c.height=256;
      const g=c.getContext('2d');
      const r=Math.min(256/img.width, 256/img.height);
      g.drawImage(img, (256-img.width*r)/2, (256-img.height*r)/2, img.width*r, img.height*r);
      symTex.dispose();
      symTex = new THREE.CanvasTexture(c);
      symTex.minFilter=THREE.LinearMipmapLinearFilter; symTex.magFilter=THREE.LinearFilter;
      fillUniforms.uTex.value = symTex;
      state.pattern = 8; refreshUI();
      URL.revokeObjectURL(url);
      toast('Símbolo carregado');
    };
    img.onerror = ()=> toast('Não consegui ler esse arquivo');
    img.src = url;
  });
  $('btnPng').onclick = exportPNG;
  $('btnJson').onclick = copyJSON;
}

function refreshUI(){
  [...$('patGrid').children].forEach((b,i)=> b.classList.toggle('on', i===state.pattern));
  [...$('modeSeg').children].forEach(b=> b.classList.toggle('on', +b.dataset.mode===state.mode));
  $('modeCaption').textContent = MODES[state.mode].cap;
  const u = MODES[state.mode].unit;
  $('lblSpacing').textContent = state.mode===2 ? 'alvo (px)' : `espaçamento (${u})`;
  $('lblLw').textContent  = `espessura (${u})`;
  $('lblSym').textContent = `símbolo (${u})`;
  sliders.forEach(([id,out,fmt])=>{ $(id).value=state[id]; $(out).textContent=fmt(state[id]); });
  $('basePct').value = Math.round(state.baseA*100);
  $('patPct').value  = Math.round(state.patA*100);
  $('outW').value = state.outW; $('dash').value = state.dash;
  $('minPx').value = state.minPx; $('maxPx').value = state.maxPx;
  ['baseColor','patColor','outColor'].forEach(id=>{ $(id).value=state[id]; $(id+'Hex').value=state[id]; });
  $('swBase').style.background=state.baseColor; $('swPat').style.background=state.patColor; $('swOut').style.background=state.outColor;
  $('tint').checked = state.tint; $('visOn').checked = state.visOn; $('bld').checked = state.bld;
  ['repPlane','repDrape','repWalls','repVolume','repScatter','volAnim','animOn','contours','sea'].forEach(id=> $(id).checked = state[id]);
  [...$('wallStyleSeg').children].forEach(b=> b.classList.toggle('on', +b.dataset.ws===state.wallStyle));
  $('wallStyleSeg').style.display = state.repWalls ? '' : 'none';
  $('post').checked = state.post;
  $('rowBloom').style.display = state.post ? '' : 'none';
  $('shadows').checked = state.shadows; $('ssao').checked = state.ssao;
  $('volBase').value = state.volBase; $('volTop').value = state.volTop;
  $('rowPlaneY').style.display = state.repPlane ? '' : 'none';
  $('rowWallH').style.display  = state.repWalls ? '' : 'none';
  $('rowVol').style.display    = (state.repVolume || state.repScatter) ? '' : 'none';
  $('rowSpeed').style.display  = state.animOn && state.repWalls ? '' : 'none';
  applyPlaneY(); rebuildWalls(); rebuildVolume(); rebuildScatter(); applyReps();
  /* controles contextuais */
  const isSolid = state.pattern===0, isSym = state.pattern===8;
  $('rowRot').style.display  = isSolid ? 'none' : '';
  $('rowLw').style.display   = (isSolid || isSym) ? 'none' : '';
  $('rowSym').style.display  = isSym ? '' : 'none';
  $('rowPxLim').style.display = state.mode===2 ? '' : 'none';
  $('rowPatColor').style.display = isSolid ? 'none' : '';
  $('dSym').style.display = isSym ? '' : 'none';
  if(isSym) $('dSym').open = true;
  /* dots dos presets */
  [...$('presets').children].forEach(b=>{
    const p = b._preset.p;
    b.querySelector('.dot').style.background =
      `linear-gradient(135deg, ${p.patColor||p.outColor||'#888'} 50%, ${p.baseColor||'#0000'} 50%)`;
  });
  rebuildOutlines();
}

/* ---------------- Loop ---------------- */
function centerPpm(){
  const a = cam.target.clone().project(camera);
  const b = cam.target.clone().add(new THREE.Vector3(1,0,0)).project(camera);
  const r = renderer.domElement;
  return Math.hypot((b.x-a.x)*r.width/2, (b.y-a.y)*r.height/2);
}
let lastT = performance.now(), clockT = 0;
function frame(t){
  const dt = Math.min((t - lastT)/1000, 0.1); lastT = t;
  clockT += dt;
  applyCam();
  const ppmC = Math.max(centerPpm(), 1e-6);
  updateLOD(ppmC, dt);

  const zEq = Math.log2(Math.max(ppmC/DPR, 1e-6) * 156543.03);
  let fade = 1;
  if(state.visOn){
    fade = Math.min((zEq - state.minZ)/state.fadeR, (state.maxZ - zEq)/state.fadeR);
    fade = Math.min(Math.max(fade, 0), 1);
  }

  const pxU = state.mode===0 ? 1 : DPR;
  const grow = Math.pow(2, lod.f);
  fillUniforms.uPattern.value = state.pattern;
  fillUniforms.uMode.value    = state.mode;
  fillUniforms.uSpacing.value = state.spacing * pxU;
  fillUniforms.uLw.value      = state.lw * pxU;
  fillUniforms.uSym.value     = state.sym * pxU;
  fillUniforms.uRot.value     = state.rot * Math.PI/180;
  fillUniforms.uBase.value    = hex4(state.baseColor, state.baseA);
  fillUniforms.uPat.value     = hex4(state.patColor,  state.patA);
  fillUniforms.uTint.value    = state.tint ? 1 : 0;
  fillUniforms.uFade.value    = fade;
  fillUniforms.uSw.value      = lod.s;
  fillUniforms.uF.value       = state.pattern===6 ? 0 : lod.f;   /* checker: snap discreto */
  fillUniforms.uHwW.value     = 0.5 * (state.lw/state.spacing) * lod.s * grow;
  fillUniforms.uArmW.value    = 0.30 * lod.s * grow;
  fillUniforms.uSymW.value    = (state.sym/state.spacing) * lod.s * grow;
  outUniforms.uColor.value.set(state.outColor);
  outUniforms.uDash.value = state.dash;
  outUniforms.uAlpha.value = fade;
  outlineGroup.visible = fade > 0.003 && state.outW > 0 && state.repPlane;
  wallUniforms.uCol.value.set(state.patColor);
  wallUniforms.uTime.value = clockT; wallUniforms.uSpeed.value = state.animSpeed;
  wallUniforms.uAnim.value = state.animOn ? 1 : 0; wallUniforms.uGFade.value = fade;
  wallUniforms.uWStyle.value = state.wallStyle;
  volUniforms.uTime.value = clockT; volUniforms.uVolAnim.value = state.volAnim ? 1 : 0;
  volUniforms.uCol.value.set(state.baseColor); volUniforms.uGFade.value = fade;
  capMat.color.set(state.baseColor);
  capMat.opacity = 0.16 * fade * (state.volAnim ? (0.8 + 0.25*Math.sin(clockT*1.1)) : 1);
  if(scatterMesh){ scatterMesh.material.color.set(state.patColor); scatterMesh.material.opacity = 0.32 * fade; }
  seaUniforms.uTime.value = clockT;

  if(shadowDirty && state.shadows) renderShadow();
  gShadowOn.value = state.shadows ? 1 : 0;
  if(state.post && rtScene){
    renderer.setRenderTarget(rtScene);
    renderer.render(scene, camera);
    const px = 1/rtA.width, py = 1/rtA.height;
    if(state.ssao){
      aoMat.uniforms.tDepth.value = rtScene.depthTexture;
      aoMat.uniforms.uProjInv.value.copy(camera.projectionMatrixInverse);
      fsPass(aoMat, rtA);
      blurMat.uniforms.tSrc.value = rtA.texture; blurMat.uniforms.uDir.value.set(px, 0); fsPass(blurMat, rtB);
      blurMat.uniforms.tSrc.value = rtB.texture; blurMat.uniforms.uDir.value.set(0, py); fsPass(blurMat, rtAO);
    }
    brightMat.uniforms.tSrc.value = rtScene.texture;
    fsPass(brightMat, rtA);
    blurMat.uniforms.tSrc.value = rtA.texture; blurMat.uniforms.uDir.value.set(px, 0);   fsPass(blurMat, rtB);
    blurMat.uniforms.tSrc.value = rtB.texture; blurMat.uniforms.uDir.value.set(0, py);   fsPass(blurMat, rtA);
    blurMat.uniforms.tSrc.value = rtA.texture; blurMat.uniforms.uDir.value.set(px*2.0, 0); fsPass(blurMat, rtB);
    blurMat.uniforms.tSrc.value = rtB.texture; blurMat.uniforms.uDir.value.set(0, py*2.0); fsPass(blurMat, rtA);
    compMat.uniforms.tScene.value = rtScene.texture;
    compMat.uniforms.tBloom.value = rtA.texture;
    compMat.uniforms.tAO.value = rtAO.texture;
    compMat.uniforms.uAoOn.value = state.ssao ? 1 : 0;
    compMat.uniforms.uBloom.value = state.bloom;
    compMat.uniforms.uTime.value = clockT;
    fsPass(compMat, rtC);
    fxaaMat.uniforms.tSrc.value = rtC.texture;
    fxaaMat.uniforms.uTexel.value.set(1/rtC.width, 1/rtC.height);
    fsPass(fxaaMat, null);
  } else {
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  }

  $('roZ').textContent = zEq.toFixed(1);
  $('roPpm').textContent = (ppmC/DPR).toFixed(2);
  if(state.mode===2){
    $('roLevel').textContent = `${Math.log2(lod.s)|0}${lod.dir? (lod.dir>0?' ↑':' ↓') : ''}`;
    $('roSpacing').textContent = (lod.s * grow * ppmC/DPR).toFixed(1)+' px';
  } else if(state.mode===1){
    $('roLevel').textContent='—'; $('roSpacing').textContent = state.spacing.toFixed(1)+' px';
  } else {
    $('roLevel').textContent='—'; $('roSpacing').textContent = (state.spacing*ppmC/DPR).toFixed(1)+' px';
  }
  requestAnimationFrame(frame);
}

/* ---------------- Export ---------------- */
function exportPNG(){
  const a=document.createElement('a');
  a.download=`pattern3d-${PATTERNS[state.pattern]}-${MODES[state.mode].id}.png`;
  a.href=renderer.domElement.toDataURL('image/png'); a.click();
  toast('PNG exportado');
}
function copyJSON(){
  const j = {
    id:`${PATTERNS[state.pattern].toLowerCase()}-ref`,
    pattern:{ type:PATTERNS[state.pattern], scaleMode:MODES[state.mode].id,
      spacing:state.spacing, spacingUnit: state.mode===0?'meters':'pixels',
      lineWidth:state.lw, symbolSize:state.sym, rotation:state.rot,
      minPixelSpacing:state.minPx, maxPixelSpacing:state.maxPx },
    appearance:{ fillColor:state.baseColor, fillOpacity:state.baseA,
      patternColor:state.patColor, patternOpacity:state.patA, patternTintSymbol:state.tint,
      outlineColor:state.outColor, outlineWidthMeters:state.outW,
      outlineDashMeters: state.dash?[state.dash, state.dash*0.6]:[0,0] },
    visibility: state.visOn ? {minZoom:state.minZ, maxZoom:state.maxZ, fadeRange:state.fadeR} : null,
    representation3d: {
      plane:   state.repPlane   ? {elevationMeters:state.planeY} : null,
      drape:   state.repDrape,
      walls:   state.repWalls   ? {topMeters:state.wallH, style:['Pulse','Flow','Hex','Energy'][state.wallStyle], animated:state.animOn, speed:state.animSpeed} : null,
      volume:  state.repVolume  ? {baseMeters:state.volBase, topMeters:state.volTop, pulse:state.volAnim} : null,
      scatter: state.repScatter } };
  const txt = JSON.stringify(j,null,2);
  (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast('JSON copiado'))
    .catch(()=>{ const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); toast('JSON copiado'); });
}

/* ---------------- Boot ---------------- */
function resize(){
  const r = viewport.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  renderer.domElement.style.width='100%'; renderer.domElement.style.height='100%';
  camera.aspect = r.width/r.height; camera.updateProjectionMatrix();
  makeRTs(Math.max(2, Math.round(r.width*DPR)), Math.max(2, Math.round(r.height*DPR)));
}
buildUI(); bindUI(); refreshUI();
new ResizeObserver(resize).observe(viewport);
if(!renderer.capabilities.isWebGL2){ state.post = false; state.ssao = false; state.shadows = false; }
updateSun(); resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
